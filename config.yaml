# AutoClip settings. No secrets here: those live in .env.
# Relative paths are resolved from the project folder.

channel:
  id: UCxa-f1esdZktFDntGV1s7Uw   # find yours at https://www.youtube.com/account_advanced

paths:
  work_dir: work          # work/<video_id>/ holds every stage's output
  log_dir: logs           # logs/pipeline.log
  state_dir: state        # SQLite state + lock files
  samples_dir: samples    # short excerpts for developing stages (download --section)

logging:
  level: INFO
  max_bytes: 5000000
  backup_count: 5

trigger:
  # ytdlp = your channel's Live tab via yt-dlp: free, no login, streams only (default)
  # rss   = public feed: free, but YouTube's feed fails often for this channel
  # api   = Data API: reliable, needs OAuth, ~2 quota units per run
  method: ytdlp
  lookback_hours: 48      # streams first seen after they ended longer ago than this are skipped (stops a backfill on first run)
  give_up_after_hours: 168  # stop rechecking a stream that stays live/processing/unavailable this long
  max_results: 15         # ytdlp/api: how many recent videos to check (rss always gives ~15)

download:
  format: "bv*[height<=1080]+ba/b[height<=1080]"
  cookies_file: null      # Netscape cookies.txt, only if YouTube starts asking yt-dlp to sign in
  deno_path: null         # path to deno.exe, only if deno isn't on PATH (yt-dlp needs it for YouTube)
  retries: 5

transcribe:
  source: auto            # auto = YouTube's auto-captions (free, with [tertawa] laugh tags), Whisper if
                          #        there are none yet after captions_wait_hours. Or: youtube, whisper
  captions_wait_hours: 6  # how long after the download to keep waiting for YouTube's captions
  model: large-v3         # best for Indonesian with English mixed in; ~3 GB VRAM at int8_float16
  device: cuda
  compute_type: int8_float16
  language: id            # Indonesian; English words still come through as spoken
  beam_size: 5
  vad_filter: true        # skip non-speech (game audio, music) before transcribing
  batch_size: 8           # parallel chunks on the GPU; 0 = sequential (slower, less VRAM)
  max_segment_seconds: 12 # split long blocks into sentences: at . ? !, at pauses, or at this length
  split_pause_seconds: 0.8
  initial_prompt: null    # optional style hint for the first 30 s
  hotwords: null          # optional words to favour everywhere, e.g. "Dota, gank, Roshan, buyback"
  # Clean-up: drop segments that are probably not speech or are decoding loops.
  # Known invented phrases ("Terima kasih telah menonton!") are always dropped.
  drop_no_speech_prob: 0.6
  drop_avg_logprob: -1.0
  drop_compression_ratio: 2.4

highlights:
  clips_per_stream: 3     # hard max 6: each upload costs ~1,600 of 10,000 daily quota units
  min_clip_seconds: 30
  max_clip_seconds: 60
  window_seconds: 45      # sliding window used for chat/audio scoring
  step_seconds: 5
  shortlist_size: 12      # top windows by laughs/loudness/chat that the LLM gets to judge
  context_seconds: 15     # transcript the LLM sees around each window, to pick clean start/end lines
  min_gap_seconds: 60     # minimum distance between picked clips
  min_llm_score: 4        # the LLM's 0-10 verdict below this: never picked, even if that means fewer clips
  laughter_tags: [tertawa]  # YouTube caption tags that count as laughs
  # Clips where the gameplay area barely moves (paused game, menus, post-game scoreboard)
  # lose up to this share of their score. 0 turns the check off; it takes ~3.5 min per hour
  # of video, once per folder (cached in motion.json).
  still_screen_penalty: 0.5
  glossary:               # nicknames and slang on your stream, explained to the LLM. Add your own.
    kotol: Keeper of the Light
    tidurin: putting an enemy hero to sleep with a skill, not going to bed
  music_flag_seconds: 20  # flag clips with this much loud audio but no speech (likely music)
  weights:                # missing signals (no chat replay, no laugh tags) are left out and the rest rescaled
    chat: 0.1             # chat is quiet on this channel for now
    laughter: 0.3         # [tertawa] tags in YouTube's captions: you and your mates laughing
    audio: 0.2            # loudness peaks
    llm: 0.4              # local LLM reading the transcript
    focus: 0.5            # only with --focus: words of the theme in the transcript
  ollama:
    host: http://127.0.0.1:11434
    model: qwen2.5:7b     # handles Indonesian better than llama3.1:8b; fits in 8 GB
    num_ctx: 8192         # set explicitly: Ollama silently truncates past its default
    temperature: 0.2
    timeout_seconds: 300  # the model is unloaded when the stage ends, freeing VRAM for rendering

render:
  layout: stacked         # stacked = gameplay on top, avatar panel below. center = plain 9:16 crop
  width: 1080
  height: 1920
  # Regions of the source frame as fractions (0-1) of its width/height.
  # Tune these with the layout preview the render stage will provide.
  gameplay: {x: 0.236, y: 0.0, w: 0.528, h: 1.0}
  avatar: {x: 0.82, y: 0.62, w: 0.18, h: 0.38}   # avatar sits bottom-right, over the minimap (measured on 8fKUNhHQR_M)
  avatar_panel_fraction: 0.4   # share of the output height given to the avatar panel
  video_encoder: h264_nvenc    # or libx264 for CPU
  quality: 23                  # NVENC cq / x264 crf: lower = better and bigger
  audio_bitrate: 160k
  normalize_audio: true        # every Short at YouTube's loudness (-14 LUFS)
  captions:
    enabled: true
    style: word_highlight      # word_highlight = current word lit up. sentence = plain lines
    font: Arial
    font_size: 80
    max_words_per_line: 4
    text_color: "#FFFFFF"
    highlight_color: "#FFD400"
    outline: 5
    y: 0.49                    # caption baseline as a fraction of the height: 0.49 = just above the Dota HUD

upload:
  privacy: private        # the only allowed value: nothing is ever published automatically
  category_id: "20"       # Gaming
  title_template: "{clip_title} #Shorts"
  description_template: "From the stream: {stream_url}\n\n#Shorts"
  tags: []
  max_uploads_per_day: 5  # quota guard across all streams in a rolling 24 h

notify:
  username: AutoClip
  mention_user_id: null   # your Discord user ID to get pinged

cleanup:
  delete_vod_after_render: false   # off: source files are kept unless you turn this on
